<div class="level-up-backdrop" (click)="close.emit()">
  <div class="level-up-card" (click)="$event.stopPropagation()">
    
    <!-- Light Rays / Ambient -->
    <div class="sunburst-rays"></div>

    <!-- Badge Icon -->
    <div class="levelup-emblem-wrap">
      <div class="levelup-emblem">
        <span class="emblem-num">{{ newLevel }}</span>
        <span class="emblem-label">NIVEL</span>
      </div>
      <div class="levelup-stars"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>
    </div>

    <span class="levelup-tag">¡SUBISTE DE NIVEL!</span>
    <h2 class="levelup-title">¡Felicitaciones, Lector/a Kinal!</h2>
    <p class="levelup-sub">
      Has superado este desafío literario y desbloqueado nuevas lecturas de la ruta formativa nacional.
    </p>

    <!-- Rewards Grid -->
    <div class="levelup-rewards">
      <div class="reward-pill-box box-xp">
        <span class="pill-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span>
        <span class="pill-val">+{{ xpGained }} XP</span>
        <span class="pill-label">Experiencia</span>
      </div>
      <div class="reward-pill-box box-coins">
        <span class="pill-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v12"/><path d="M15.5 9.4a4 4 0 0 0-7 0"/><path d="M8.5 14.6a4 4 0 0 0 7 0"/></svg></span>
        <span class="pill-val">+{{ coinsGained }}</span>
        <span class="pill-label">Monedas Kinal</span>
      </div>
    </div>

    <!-- Action Button -->
    <button (click)="close.emit()" class="btn-levelup-continue">
      <span>Continuar en la Ruta</span>
      <span><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
    </button>

  </div>
</div>
