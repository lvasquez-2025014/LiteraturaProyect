<div
  class="dock-outer"
  [ngClass]="[className, 'layout-' + layout, 'theme-' + theme]"
  role="region"
  [attr.aria-label]="ariaLabel"
>
  <div
    #panelRef
    class="dock-panel"
    [style.height.px]="panelHeight"
    (mousemove)="onPanelMouseMove($event)"
    (mouseleave)="onPanelMouseLeave()"
    role="toolbar"
    [attr.aria-label]="ariaLabel"
  >
    <a
      #dockItemRef
      *ngFor="let item of items; let i = index"
      [routerLink]="item.route || null"
      (click)="onItemClick(item, $event)"
      class="dock-item"
      [ngClass]="[
        item.className || '',
        hoveredIndex === i ? 'hovered' : '',
        isItemActive(item) ? 'active' : ''
      ]"
      [style.width.px]="itemStates[i]?.size || baseItemSize"
      [style.height.px]="itemStates[i]?.size || baseItemSize"
      (mouseenter)="onItemMouseEnter(i)"
      (mouseleave)="onItemMouseLeave(i)"
      (focus)="onItemFocus(i)"
      (blur)="onItemBlur(i)"
      (keydown)="onItemKeyDown($event, item)"
      tabindex="0"
      role="button"
      [attr.aria-label]="item.label"
    >
      <!-- Icon Container -->
      <div class="dock-icon">
        <ng-container *ngIf="item.icon; else fallbackLabel">
          <span [innerHTML]="getSafeSvg(item.icon)" class="icon-svg-wrapper"></span>
        </ng-container>
        <ng-template #fallbackLabel>
          <span class="icon-fallback">{{ item.label.charAt(0) }}</span>
        </ng-template>
      </div>

      <!-- Active macOS-style Indicator Dot / Glow -->
      <span class="dock-active-dot" *ngIf="isItemActive(item)"></span>

      <!-- Floating Animated Tooltip Label (Solo se muestra el tooltip para el item actualmente bajo el cursor) -->
      <div
        class="dock-label"
        [ngClass]="[
          'position-' + resolvedLabelPosition,
          hoveredIndex === i ? 'visible' : ''
        ]"
        role="tooltip"
        [attr.aria-hidden]="hoveredIndex !== i"
      >
        <span>{{ item.label }}</span>
        <span class="dock-label-badge" *ngIf="item.badge">{{ item.badge }}</span>
      </div>
    </a>
  </div>
</div>
