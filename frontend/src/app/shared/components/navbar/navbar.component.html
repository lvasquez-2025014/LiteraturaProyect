<!-- Barra Superior Móvil (Pantallas pequeñas < 992px) -->
<header class="mobile-top-bar">
  <button
    type="button"
    class="mobile-menu-btn"
    (click)="toggleMobileMenu()"
    aria-label="Abrir menú de navegación"
    [attr.aria-expanded]="isMobileMenuOpen"
  >
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>

  <a routerLink="/" class="mobile-brand" (click)="closeMobileMenu()">
    <img src="/logo.png" alt="Proyecto Literatura" class="mobile-brand-logo" />
    <span class="mobile-brand-title">Proyecto <span class="accent">Literatura</span></span>
  </a>

  <div class="mobile-user-actions" *ngIf="user as u">
    <button (click)="logout()" class="mobile-logout-btn" title="Cerrar sesión" aria-label="Cerrar sesión">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    </button>
  </div>
</header>

<!-- Backdrop para Móvil -->
<div
  class="sidebar-backdrop"
  *ngIf="isMobileMenuOpen"
  (click)="closeMobileMenu()"
  aria-hidden="true"
></div>

<!-- Barra de Navegación Lateral Izquierda (Sidebar) -->
<aside class="app-sidebar" [class.is-open]="isMobileMenuOpen" aria-label="Navegación principal">
  
  <!-- Botón de Cerrar para Móvil (Oculto en desktop) -->
  <div class="sidebar-mobile-close-bar">
    <button
      type="button"
      class="sidebar-close-btn"
      (click)="closeMobileMenu()"
      aria-label="Cerrar menú"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <!-- Menú Ramificado Interactivo (BranchedMenu de React Bits) -->
  <div class="sidebar-nav-scroll">
    <app-branched-menu
      [items]="branchedMenuItems"
      [defaultOpen]="[0, 1]"
      [defaultActive]="currentActiveItem"
      [color]="'#F8FAFC'"
      [accentColor]="'#38BDF8'"
      [lineColor]="'rgba(56, 189, 248, 0.35)'"
      [width]="236"
      [rowHeight]="38"
      [indent]="36"
      [trunk]="14"
      [radius]="10"
      [lineWidth]="1.5"
      [fontSize]="13.5"
      [drawDuration]="400"
      [foldDuration]="300"
      (selectItem)="onMenuSelect($event)"
    ></app-branched-menu>
  </div>

  <!-- Métricas Rápidas de Gamificación -->
  <div class="sidebar-gamification" *ngIf="user as u">
    <div class="gamification-grid">
      <!-- Racha -->
      <div class="metric-item metric-streak" title="Racha de lectura">
        <div class="metric-meta">
          <span class="metric-val">{{ streakDays }}</span>
          <span class="metric-lbl">Días racha</span>
        </div>
        <div class="metric-bottom-bar"></div>
      </div>

      <!-- XP -->
      <div class="metric-item metric-xp" title="Puntos de Experiencia">
        <div class="metric-meta">
          <span class="metric-val">{{ formatStat(totalXp) }}</span>
          <span class="metric-lbl">Puntos XP</span>
        </div>
        <div class="metric-bottom-bar"></div>
      </div>

      <!-- Nivel -->
      <div class="metric-item metric-level" title="Nivel del lector">
        <div class="metric-meta">
          <span class="metric-val">Nvl {{ currentLevel }}</span>
          <span class="metric-lbl">Rango</span>
        </div>
        <div class="metric-bottom-bar"></div>
      </div>

      <!-- Monedas -->
      <div class="metric-item metric-coins" title="Monedas de sabiduría">
        <div class="metric-meta">
          <span class="metric-val">{{ formatStat(coins) }}</span>
          <span class="metric-lbl">Monedas</span>
        </div>
        <div class="metric-bottom-bar"></div>
      </div>
    </div>
  </div>

  <!-- Pie de Sidebar: Perfil de Usuario y Logout -->
  <div class="sidebar-footer" *ngIf="user as u">
    <div class="user-profile-row">
      <div class="avatar-circle" [ngClass]="equippedFrame">
        <img *ngIf="u.avatarUrl" [src]="u.avatarUrl" [alt]="u.name" class="avatar-img" />
        <span *ngIf="!u.avatarUrl" class="avatar-initial">{{ u.name ? u.name.charAt(0).toUpperCase() : 'U' }}</span>
      </div>

      <div class="user-info">
        <span class="user-name" [title]="u.name">{{ u.name }}</span>
        <span class="user-sub">{{ u.grade ? u.grade + ' "' + (u.section || 'A') + '"' : u.email }}</span>
      </div>
    </div>

    <!-- Botón de Cerrar Sesión -->
    <button (click)="logout()" class="sidebar-logout-btn" title="Cerrar sesión actual">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span>Cerrar Sesión</span>
    </button>
  </div>

</aside>
